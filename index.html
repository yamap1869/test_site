<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索サイトリンク</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", "Meiryo", sans-serif;
      background: #f4f7fb;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      text-align: center;
      width: min(90%, 520px);
    }
    h1 { margin-bottom: 30px; }
    .links {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      padding: 16px 34px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      color: white;
      transition: transform .15s, opacity .15s;
    }
    a:hover { transform: translateY(-2px); opacity: .9; }
    .google { background: #4285f4; }
    .yahoo { background: #6b21a8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>検索サイト</h1>
    <div class="links">
      <a class="google" href="https://www.google.co.jp/" target="_blank" rel="noopener noreferrer">
        Google
      </a>
      <a class="yahoo" href="https://www.yahoo.co.jp/" target="_blank" rel="noopener noreferrer">
        Yahoo! JAPAN
      </a>
    </div>
  </div>
</body>
</html>
